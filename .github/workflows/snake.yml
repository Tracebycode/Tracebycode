name: Generate Contribution Snake

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  # Allows manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Generate the contribution grid snake animations (light & dark theme)
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Tracebycode
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Deploy directly to the root of the 'output' branch
      - name: Deploy to Output Branch
        uses: CrazyMax/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
